name: Update prices
on:
  push:
    paths: ['price.xlsx']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Parse price.xlsx
        id: parse
        run: |
          cat > parse_price.py <<'PY'
          import sys, json, re, hashlib, datetime
          from openpyxl import load_workbook

          SKIP = ('доставка по', 'заявки менее', 'заказы по', 'whatsapp')

          def num(v):
              if v is None: return None
              if isinstance(v, (int, float)): return float(v)
              s = str(v).replace('\xa0', '').replace(' ', '').replace(',', '.')
              try: return float(s)
              except ValueError: return None

          def clean(v): return re.sub(r'\s+', ' ', str(v)).strip() if v is not None else ''

          def main(src, dst):
              wb = load_workbook(src, data_only=True)
              groups, total = [], 0
              for ws in wb.worksheets:
                  if not ws.title.strip().lower().startswith('прайс'):
                      continue
                  started, cur = False, None
                  for a, b, c, d in ws.iter_rows(min_col=1, max_col=4, values_only=True):
                      name = clean(b)
                      if not started:
                          if name.lower().startswith('наименование'): started = True
                          continue
                      if any(name.lower().startswith(x) for x in SKIP): break
                      if not name: continue
                      cash, tr = num(c), num(d)
                      if cash is None and tr is None:
                          if num(a) is None:            # строка-заголовок группы
                              cur = {'name': name, 'items': []}; groups.append(cur)
                          continue
                      if cur is None: continue
                      cash = cash if cash is not None else tr
                      tr = tr if tr is not None else cash
                      n = num(a)
                      pid = str(int(n)) if n is not None else 'x' + hashlib.md5(name.encode()).hexdigest()[:6]
                      cur['items'].append({'id': pid, 'name': name.replace('|', '/'), 'c': round(cash, 2), 't': round(tr, 2)})
                      total += 1
              groups = [g for g in groups if g['items']]
              if total < 10:
                  sys.exit('Найдено слишком мало товаров (%d): проверьте формат файла' % total)
              now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=10)))
              json.dump({'updated': now.strftime('%d.%m.%Y %H:%M'), 'groups': groups}, open(dst, 'w', encoding='utf-8'), ensure_ascii=False, separators=(',', ':'))
              print('позиций: %d, групп: %d' % (total, len(groups)))

          main(sys.argv[1], sys.argv[2])
          PY
          python parse_price.py price.xlsx prices.json | tee out.txt
          echo "info=$(cat out.txt)" >> "$GITHUB_OUTPUT"
      - name: Commit prices.json
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          if ! git diff --cached --quiet; then git commit -m "Обновление цен" && git push; fi
      - name: Rebuild site
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          OK: ${{ steps.parse.outcome }}
          INFO: ${{ steps.parse.outputs.info }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          if [ "$OK" = "success" ]; then T="✅ Прайс обновлён ($INFO). Сайт покажет новые цены через 1–2 минуты."
          else T="❌ Не удалось прочитать прайс. Проверьте файл: листы «прайс 1…3», столбцы №, наименование, цена наличные, цена перевод."; fi
          curl -s "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$T" > /dev/null
